<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Bluerydge Arena — Wallpaper</title>
<style>
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:block;
  src:url(data:font/woff2;base64,__FONT_PRESSSTART__) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:block;
  src:url(data:font/woff2;base64,__FONT_RAJDHANI__) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020409}
body{cursor:default}
body.idle{cursor:none}

/* ── layer stack ───────────────────────────────────────────────
   0 scene  static painted background (repainted only on resize)
   1 marks  Bluerydge logo, one per monitor panel
   2 grade  vignette + scanlines
   3 fx     animated canvas, bottom strip only
   9 panel  settings UI                                          */
#scene,#fx{position:fixed;display:block;image-rendering:pixelated}
#scene{left:0;top:0;z-index:0}
#fx{left:0;z-index:3;pointer-events:none}

#marks{position:fixed;inset:0;z-index:1;pointer-events:none}
/* Horizontal lockup: hex mark on the left, wordmark on the right.
   will-change gives the mark its own compositor layer, so the opacity pulse
   and the drift never repaint the artwork underneath them. */
.mark{position:absolute;display:flex;flex-direction:row;align-items:center;
  transform:translate(-50%,-50%);animation:breathe 7s ease-in-out infinite;
  will-change:opacity,transform}
/* The placemat card does not pulse — it is a large, expensive element and a
   breathing advert is the wrong look besides. */
.mark.nopulse{animation:none}
/* the mark lights up while a portal is open through it */
.mark.flare{filter:brightness(1.5) drop-shadow(0 0 26px rgba(140,235,255,.85))
  drop-shadow(0 0 60px rgba(0,170,255,.55))}
.mark{transition:filter .25s ease-out}
.mark.nopulse.drift{animation:drift 320s steps(1,end) infinite}
.mark .hexwrap{position:relative;display:block;
  filter:drop-shadow(0 0 14px rgba(224,33,63,.35)) drop-shadow(0 0 22px rgba(0,170,255,.4))}
.mark .pm{display:block;width:auto;height:auto;
  filter:drop-shadow(0 10px 40px rgba(0,0,0,.65)) drop-shadow(0 0 60px rgba(0,120,255,.28))}
/* ── Placemat card ────────────────────────────────────────────────────
   A reconstruction of the Bluerydge placemat, built from the brand's own
   elements. Everything is sized in em against the card's own font-size, so
   the whole thing scales from one number. Drop assets/placemat.* in and this
   is bypassed entirely in favour of the real artwork. */
.card{position:relative;display:grid;grid-template-columns:25% 40.5% 34.5%;
  overflow:hidden;border-radius:.3em;background:#08172a;
  box-shadow:0 .9em 2.2em rgba(0,0,0,.62),0 0 2.6em rgba(0,110,220,.18);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.card>*{position:relative;z-index:1}

.cLogo{display:flex;align-items:center;justify-content:center;gap:.9em;
  background:linear-gradient(135deg,#0d2440 0%,#07172c 55%,#050f1e 100%)}
.cLogo .cWord{font-family:Rajdhani,'Segoe UI',sans-serif;font-weight:700;color:#fff;
  font-size:2.05em;letter-spacing:.02em;line-height:1;white-space:nowrap}

.cCopy{display:flex;flex-direction:column;justify-content:center;padding:0 1.1em 0 1.3em;
  background:linear-gradient(100deg,#0c2f52 0%,#0a2542 48%,#081c33 100%)}
.cCopy:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 90% at 85% 40%,rgba(40,150,230,.20),transparent 70%)}
.cTag1{color:#fff;font-weight:300;font-size:3.5em;line-height:1.12;letter-spacing:-.015em;
  white-space:nowrap}
.cTag2{color:#22d3ee;font-weight:700;font-size:3.62em;line-height:1.12;letter-spacing:-.015em;
  white-space:nowrap;text-shadow:0 0 .5em rgba(34,211,238,.35)}
.cBul{display:grid;grid-template-columns:auto auto;column-gap:1.5em;row-gap:.35em;
  margin-top:1.7em;font-size:1.12em;color:#dbe9f7;font-weight:400;white-space:nowrap}
.cBul span{display:flex;align-items:center;gap:.6em}
.cBul i{width:.5em;height:.5em;border-radius:50%;background:#22d3ee;flex:none;
  box-shadow:0 0 .5em rgba(34,211,238,.8)}
.cFoot{display:flex;align-items:center;gap:1.5em;margin-top:1.15em;font-size:1.12em;color:#eaf4ff}
.cFoot span{display:flex;align-items:center;gap:.55em;white-space:nowrap}
.cFoot svg{width:1.35em;height:1.35em;flex:none}

.cStrips{display:grid;grid-template-columns:.55fr 1fr 1.15fr 1.05fr;gap:.22em;background:#050e1c}
.cStrips figure{position:relative;overflow:hidden;margin:0}
.cStrips svg{position:absolute;inset:0;width:100%;height:100%}
.cBR{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI',system-ui,sans-serif;font-weight:800;font-size:7.2em;line-height:1;
  letter-spacing:.02em;color:rgba(255,255,255,.72);pointer-events:none;
  text-shadow:0 .04em .3em rgba(0,0,0,.35)}

.mark .word{font-family:Rajdhani,'Segoe UI',sans-serif;font-weight:700;color:#ffffff;
  white-space:nowrap;line-height:1;text-shadow:0 0 26px rgba(120,210,255,.45),0 0 70px rgba(0,120,255,.25)}
@keyframes breathe{0%,100%{opacity:.94}50%{opacity:.72}}
/* Screensaver duty: shift the mark around so it never burns into an OLED.
   Deliberately stepped, not smooth. A continuous 320s creep moves about a
   quarter-pixel per second, so nearly every frame recomposites a large layer
   to the same rounded position — all cost, no movement. Eight discrete jumps
   protect the panel just as well and composite only eight times. */
.mark.drift{animation:breathe 7s ease-in-out infinite,drift 320s steps(1,end) infinite}
@keyframes drift{
  0%   {transform:translate(-50%,-50%)}
  12.5%{transform:translate(calc(-50% + 34px),calc(-50% - 24px))}
  25%  {transform:translate(calc(-50% + 12px),calc(-50% + 28px))}
  37.5%{transform:translate(calc(-50% - 30px),calc(-50% + 12px))}
  50%  {transform:translate(calc(-50% - 18px),calc(-50% - 28px))}
  62.5%{transform:translate(calc(-50% + 26px),calc(-50% + 6px))}
  75%  {transform:translate(calc(-50% - 8px),calc(-50% + 30px))}
  87.5%{transform:translate(calc(-50% + 30px),calc(-50% - 10px))}
  100% {transform:translate(-50%,-50%)}}

/* still mode: kill every animation so an export is byte-deterministic
   regardless of when the screenshot lands */
body.still .mark{animation:none;opacity:.92}
body.still #boot{display:none}

#grade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse 62% 68% at 50% 42%,transparent 52%,rgba(0,3,10,.72) 100%)}
#grade.nogr{background:radial-gradient(ellipse 62% 68% at 50% 42%,transparent 52%,rgba(0,3,10,.72) 100%)}

/* ── settings panel (press H) ─────────────────────────────── */
#panel{position:fixed;right:16px;top:16px;z-index:9;width:280px;display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9ff;
  background:rgba(6,14,28,.93);border:1px solid rgba(0,170,255,.35);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.6)}
#panel.on{display:block}
#panel h2{font:400 10px/1.6 'Press Start 2P',monospace;color:#5fd0ff;margin-bottom:12px;letter-spacing:1px}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
#panel label span:first-child{opacity:.75}
#panel output{min-width:44px;text-align:right;color:#7fe3ff}
#panel input[type=range]{flex:1;accent-color:#00b4ff;min-width:0}
#panel input[type=checkbox]{accent-color:#00b4ff}
#panel select{flex:1;min-width:0;font:inherit;color:#cfe9ff;background:#0a1e38;
  border:1px solid rgba(0,170,255,.4);border-radius:6px;padding:3px 6px}
#panel .row{display:flex;gap:8px;margin-top:12px}
#panel button{flex:1;font:inherit;color:#cfe9ff;background:rgba(0,140,255,.16);cursor:pointer;
  border:1px solid rgba(0,170,255,.4);border-radius:6px;padding:6px 8px}
#panel button:hover{background:rgba(0,140,255,.3)}
#panel .hint{margin-top:10px;font-size:11px;opacity:.5;line-height:1.5}
/* ── leaderboard (press L) ────────────────────────────────── */
#board{position:fixed;left:16px;top:16px;z-index:9;width:300px;display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9ff;
  background:rgba(6,14,28,.93);border:1px solid rgba(0,170,255,.35);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.6)}
#board.on{display:block}
#board h2{font:400 10px/1.6 'Press Start 2P',monospace;color:#5fd0ff;margin-bottom:10px;letter-spacing:1px}
#board .hint{margin-top:10px;font-size:11px;opacity:.5;line-height:1.5}
#board .row2{display:grid;grid-template-columns:1.4em 1fr 3.2em 3em;gap:8px;
  align-items:center;padding:3px 0;white-space:nowrap}
#board .row2 .nm{overflow:hidden;text-overflow:ellipsis}
#board .bar{grid-column:2/5;height:3px;border-radius:2px;background:rgba(120,200,255,.14);
  overflow:hidden;margin-bottom:3px}
#board .bar i{display:block;height:100%;border-radius:2px}
#board .empty{opacity:.55;padding:6px 0}

#boot{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  background:#020409;font:400 11px/1.6 'Press Start 2P',monospace;color:#3d7fa8;
  transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="marks"></div>
<div id="grade"></div>
<canvas id="fx"></canvas>
<div id="boot">BLUERYDGE ARENA</div>

<div id="board">
  <h2>ARENA STANDINGS</h2>
  <div id="board-rows"></div>
  <div class="hint">Wins level a fighter up. Level 3 evolves; level 6 is final form.</div>
</div>

<div id="panel">
  <h2>ARENA SETUP</h2>
  <label><span>Monitors</span><input id="p-screens" type="range" min="1" max="4" step="1"><output id="o-screens"></output></label>
  <label><span>Fighter size</span><input id="p-scale" type="range" min="1" max="5" step="1"><output id="o-scale"></output></label>
  <label><span>Taskbar (px)</span><input id="p-taskbar" type="range" min="0" max="140" step="2"><output id="o-taskbar"></output></label>
  <label><span>Fighters</span><input id="p-count" type="range" min="1" max="16" step="1"><output id="o-count"></output></label>
  <label><span>Max FPS</span><input id="p-fps" type="range" min="15" max="60" step="5"><output id="o-fps"></output></label>
  <label><span>Guests</span><select id="p-guests">
    <option value="mix">Robots + creatures</option>
    <option value="robohash">Robots only</option>
    <option value="pokeapi">Creatures only</option>
    <option value="endpoint">My endpoint</option>
    <option value="off">Off (no network)</option>
  </select></label>
  <label><span>Duels</span><input id="p-duels" type="checkbox"></label>
  <label><span>Levels</span><input id="p-levels" type="checkbox"></label>
  <label><span>Portal</span><input id="p-portal" type="checkbox"></label>
  <label><span>Day cycle</span><input id="p-ambient" type="checkbox"></label>
  <label><span>Logo</span><input id="p-logo" type="checkbox"></label>
  <label><span>Scanlines</span><input id="p-grain" type="checkbox"></label>
  <div class="row"><button id="p-copy">Copy URL</button><button id="p-reset">Reset</button></div>
  <div class="row"><button id="p-wipe">Reset progress</button></div>
  <div class="hint">H settings &middot; L leaderboard. Saved locally; Copy URL bakes them in.</div>
</div>

<script>
__APP_JS__
</script>
</body>
</html>
