<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Portal Valley — Wallpaper</title>
<style>
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:block;
  src:url(data:font/woff2;base64,__FONT_PRESSSTART__) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:block;
  src:url(data:font/woff2;base64,__FONT_RAJDHANI__) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020409}
body{cursor:default}
body.idle{cursor:none}

/* ── layer stack ───────────────────────────────────────────────
   0 scene  static painted background (repainted only on resize)
   1 marks  hosts the sky portal (three.js canvas)
   2 grade  vignette + scanlines
   3 fx     animated canvas, bottom strip only
   9 panel  settings UI                                          */
#scene,#fx,#beam,#sky{position:fixed;display:block;image-rendering:pixelated}
#beam{left:0;top:0;z-index:3;pointer-events:none;display:none}
#sky{left:0;top:0;z-index:2;pointer-events:none;display:none}
#scene{left:0;top:0;z-index:0}
#fx{left:0;z-index:3;pointer-events:none}

#marks{position:fixed;inset:0;z-index:1;pointer-events:none}
#portal{position:absolute;pointer-events:none;
  filter:drop-shadow(0 0 22px rgba(255,200,120,.55)) drop-shadow(0 0 60px rgba(255,170,80,.3))}
#portal canvas{width:100%;height:100%;display:block}

#grade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse 62% 68% at 50% 42%,transparent 52%,rgba(0,3,10,.72) 100%)}
#grade.nogr{background:radial-gradient(ellipse 62% 68% at 50% 42%,transparent 52%,rgba(0,3,10,.72) 100%)}

/* ── settings panel (press H) ─────────────────────────────── */
#panel{position:fixed;right:16px;top:16px;z-index:9;width:280px;display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9ff;
  background:rgba(6,14,28,.93);border:1px solid rgba(0,170,255,.35);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.6)}
#panel.on{display:block}
#panel h2{font:400 10px/1.6 'Press Start 2P',monospace;color:#5fd0ff;margin-bottom:12px;letter-spacing:1px}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
#panel label span:first-child{opacity:.75}
#panel output{min-width:44px;text-align:right;color:#7fe3ff}
#panel input[type=range]{flex:1;accent-color:#00b4ff;min-width:0}
#panel input[type=checkbox]{accent-color:#00b4ff}
#panel select{flex:1;min-width:0;font:inherit;color:#cfe9ff;background:#0a1e38;
  border:1px solid rgba(0,170,255,.4);border-radius:6px;padding:3px 6px}
#panel .row{display:flex;gap:8px;margin-top:12px}
#panel button{flex:1;font:inherit;color:#cfe9ff;background:rgba(0,140,255,.16);cursor:pointer;
  border:1px solid rgba(0,170,255,.4);border-radius:6px;padding:6px 8px}
#panel button:hover{background:rgba(0,140,255,.3)}
#panel .hint{margin-top:10px;font-size:11px;opacity:.5;line-height:1.5}
/* ── leaderboard (press L) ────────────────────────────────── */
#board{position:fixed;left:16px;top:16px;z-index:9;width:300px;display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9ff;
  background:rgba(6,14,28,.93);border:1px solid rgba(0,170,255,.35);border-radius:10px;
  padding:14px 16px;backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(0,0,0,.6)}
#board.on{display:block}
#board h2{font:400 10px/1.6 'Press Start 2P',monospace;color:#5fd0ff;margin-bottom:10px;letter-spacing:1px}
#board .hint{margin-top:10px;font-size:11px;opacity:.5;line-height:1.5}
#board .row2{display:grid;grid-template-columns:1.4em 1fr 3.2em 3em;gap:8px;
  align-items:center;padding:3px 0;white-space:nowrap}
#board .row2 .nm{overflow:hidden;text-overflow:ellipsis}
#board .bar{grid-column:2/5;height:3px;border-radius:2px;background:rgba(120,200,255,.14);
  overflow:hidden;margin-bottom:3px}
#board .bar i{display:block;height:100%;border-radius:2px}
#board .empty{opacity:.55;padding:6px 0}

#spanhint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:10;
  max-width:520px;font:13px/1.55 'Segoe UI',system-ui,sans-serif;color:#eaf4ff;
  background:rgba(8,18,32,.95);border:1px solid rgba(120,190,255,.4);border-radius:10px;
  padding:12px 16px;box-shadow:0 10px 36px rgba(0,0,0,.55)}
#spanhint code{font-family:ui-monospace,monospace;background:rgba(120,190,255,.15);
  padding:0 4px;border-radius:4px}
#spanhint button{display:block;margin-top:8px;font:inherit;color:#eaf4ff;cursor:pointer;
  background:rgba(80,150,255,.25);border:1px solid rgba(120,190,255,.5);border-radius:6px;
  padding:4px 12px}

#boot{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  background:#020409;font:400 11px/1.6 'Press Start 2P',monospace;color:#3d7fa8;
  transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="marks"></div>
<div id="grade"></div>
<canvas id="fx"></canvas>
<canvas id="beam"></canvas>
<canvas id="sky"></canvas>
<div id="boot">PORTAL VALLEY</div>

<div id="board">
  <h2>ARENA STANDINGS</h2>
  <div id="board-rows"></div>
  <div class="hint">Wins level a fighter up. Level 3 evolves; level 6 is final form.</div>
</div>

<div id="panel">
  <h2>ARENA SETUP</h2>
  <label><span>Monitors</span><input id="p-screens" type="range" min="1" max="4" step="1"><output id="o-screens"></output></label>
  <label><span>Fighter size</span><input id="p-scale" type="range" min="1" max="5" step="1"><output id="o-scale"></output></label>
  <label><span>Taskbar (px)</span><input id="p-taskbar" type="range" min="0" max="140" step="2"><output id="o-taskbar"></output></label>
  <label><span>Fighters</span><input id="p-count" type="range" min="1" max="16" step="1"><output id="o-count"></output></label>
  <label><span>Max FPS</span><input id="p-fps" type="range" min="15" max="60" step="5"><output id="o-fps"></output></label>
  <label><span>Guests</span><select id="p-guests">
    <option value="mix">Robots + creatures</option>
    <option value="robohash">Robots only</option>
    <option value="pokeapi">Creatures only</option>
    <option value="endpoint">My endpoint</option>
    <option value="off">Off (no network)</option>
  </select></label>
  <label><span>Duels</span><input id="p-duels" type="checkbox"></label>
  <label><span>Raids</span><input id="p-raids" type="checkbox"></label>
  <label><span>Levels</span><input id="p-levels" type="checkbox"></label>
  <label><span>Portal</span><input id="p-portal" type="checkbox"></label>
  <label><span>Day cycle</span><input id="p-ambient" type="checkbox"></label>
  <label><span>Scanlines</span><input id="p-grain" type="checkbox"></label>
  <div class="row"><button id="p-copy">Copy URL</button><button id="p-reset">Reset</button></div>
  <div class="row"><button id="p-wipe">Reset progress</button></div>
  <div class="hint">H settings &middot; L leaderboard. Saved locally; Copy URL bakes them in.</div>
</div>

<script>
__THREE_JS__
</script>
<script>
__APP_JS__
</script>
</body>
</html>
